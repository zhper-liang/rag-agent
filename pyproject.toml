[project]
name = "ragagent"
version = "0.1.0"
description = "RAG 问答系统（LangGraph + Milvus DISKANN）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "langchain-openai==1.6.6",
    "langgraph==1.2.12",
    "pydantic==2.13.5",
    "pymilvus==2.5.18",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
