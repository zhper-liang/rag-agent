[project]
name = "ragagent"
version = "0.1.0"
description = "RAG 问答系统（LangGraph + Milvus DISKANN）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasketch==2.0.0",
    "einops==0.8.2",
    "fastapi==0.141.1",
    "ftfy==6.3.1",
    "huggingface-hub==1.33.0",
    "imagehash==4.3.2",
    "jinja2==3.1.6",
    "langchain-community==0.3.31",
    "langchain-openai==1.6.6",
    "langfuse==4.16.0",
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
    "markdown-it-py==4.2.0",
    "pillow==12.3.0",
    "prometheus-client==0.26.0",
    "pydantic==2.13.5",
    "pymilvus==2.5.18",
    "pymupdf==1.28.2",
    "pyyaml==6.0.3",
    "ragas==0.4.3",
    "rapidfuzz==3.14.6",
    "sentencepiece==0.2.2",
    "timm==1.0.30",
    "tokenizers==0.22.2",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==5.0.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "hypothesis==6.168.3",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
