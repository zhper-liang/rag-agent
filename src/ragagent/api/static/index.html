<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG 问答演示</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-left">
      <button type="button" id="toggle-side" aria-controls="side" aria-expanded="true">侧栏</button>
      <div>
        <h1>RAG 问答演示</h1>
        <p class="sub">本地演示页，接口没有鉴权，只在本机或可信内网打开。</p>
      </div>
    </div>
    <button type="button" id="new-chat">新会话</button>
  </header>

  <aside id="side" class="side" aria-label="会话与检索范围">
    <section class="panel" aria-labelledby="h-sessions">
      <h2 id="h-sessions">会话历史</h2>
      <p class="hint">只存在本浏览器；删除不影响服务端会话记录。</p>
      <ul id="sessions" class="sessions"></ul>
    </section>

    <section class="panel" aria-labelledby="h-scope">
      <h2 id="h-scope">检索范围</h2>
      <fieldset class="types">
        <legend>文件类型（不选为全部）</legend>
        <div id="types"></div>
      </fieldset>
      <p class="hint" id="picked-hint">文档：全部</p>
      <ul id="picked" class="picked"></ul>
      <button type="button" id="clear-scope" hidden>清空范围</button>
    </section>

    <section class="panel" aria-labelledby="h-docs">
      <h2 id="h-docs">文档</h2>
      <label for="doc-search" class="sr-only">按标题搜索文档</label>
      <input id="doc-search" type="search" placeholder="按标题搜索" autocomplete="off">
      <p class="hint" id="docs-hint" role="status"></p>
      <ul id="docs" class="docs"></ul>
    </section>
  </aside>

  <main id="log" aria-label="对话记录">
    <p class="empty" id="empty">输入问题开始。回答里的 [n] 指向下方来源，灰色表示没能在资料中核实。</p>
  </main>

  <form id="ask" class="ask">
    <label for="question" class="sr-only">问题</label>
    <textarea id="question" rows="2" placeholder="输入问题，Enter 发送，Shift+Enter 换行" required></textarea>
    <div class="actions">
      <button type="submit" id="send">发送</button>
      <button type="button" id="stop" hidden>停止</button>
    </div>
  </form>

  <div id="status" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
